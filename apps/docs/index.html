<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YPW8JE1RJ6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    // 로컬에서는 config 자체를 호출하지 않는다.
    // send_page_view: false는 page_view만 막을 뿐, config 호출은 그것만으로도
    // session_start·first_visit를 전송한다. vite preview는 프로덕션 빌드라
    // 스니펫이 살아 있어, 이 가드가 없으면 내 확인 트래픽이 페이지뷰 없는
    // 세션으로 집계되어 이탈률과 세션 시간을 망친다.
    // 해시 라우트를 해시 없는 정규 URL로 만든다.
    // GA4는 pagePath를 page_location에서 해시를 떼고 만들기 때문에, 그냥 두면
    // ".../iris-design-system/#/components"가 전부 "/iris-design-system/"로 접힌다.
    function canonicalUrl() {
      var route = location.hash.replace(/^#/, '') || '/';
      var base = location.pathname.replace(/index\.html$/, '').replace(/\/$/, '');
      return location.origin + base + route;
    }

    // 내부 트래픽(=내 방문) 표시.
    // 사이트에 ?internal=1 로 한 번 들어오면 이 브라우저에 기억되고, 이후 모든
    // 이벤트에 traffic_type=internal 이 붙는다. GA의 데이터 필터가 이 값을 보고
    // 거른다. ?internal=0 으로 해제.
    //
    // IP 기반 필터와 달리 IP가 바뀌어도 유효하고, 같은 네트워크의 남의 방문을
    // 잘못 제외하지도 않는다. 둘은 같은 traffic_type 값을 쓰므로 병행해도 된다.
    function readParam(name) {
      var qs = location.search;
      var h = location.hash.indexOf('?')
      if (h >= 0) qs += '&' + location.hash.slice(h + 1);
      return new URLSearchParams(qs).get(name)
    }
    function isInternalTraffic() {
      try {
        var v = readParam('internal');
        if (v === '1') localStorage.setItem('ga_internal', '1');
        if (v === '0') localStorage.removeItem('ga_internal');
        return localStorage.getItem('ga_internal') === '1';
      } catch (e) {
        return false; // 시크릿 모드 등에서 localStorage 접근이 throw 할 수 있다
      }
    }
    if (!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
      gtag('js', new Date());
      // 해시 라우팅이라 자동 페이지뷰는 끄고, 라우트가 바뀔 때마다 직접 보낸다.
      // 켜두면 최초 진입이 자동 1회 + 수동 1회로 중복 집계된다.
      //
      // page_location을 여기 config에 실어야 한다. App.tsx의 gtag('set')은 React가
      // 마운트된 뒤에야 돌아서, 그 이전에 발생하는 session_start·first_visit·초기
      // scroll이 "/iris-design-system/"로 새어 나간다(2026-09-09 GA에서 확인).
      // config 파라미터는 이후 모든 이벤트의 기본값이 되므로 마운트 전까지 덮는다.
      var gaConfig = {
        send_page_view: false,
        page_location: canonicalUrl(),
      };
      if (isInternalTraffic()) {
        gaConfig.traffic_type = 'internal';
        console.info('[GA] 내부 트래픽으로 표시됨 — traffic_type=internal');
      }
      gtag('config', 'G-YPW8JE1RJ6', gaConfig);
    }
  </script>
  <!-- End Google tag -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>Iris Design System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
